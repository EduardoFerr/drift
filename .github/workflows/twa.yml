name: twa

on:
  # Build APK/AAB em tag de versão e anexa ao GitHub Release
  push:
    tags:
      - 'v*'
  # Permite disparar manualmente sem criar tag (útil pra testes)
  workflow_dispatch:
    inputs:
      attach_to_release:
        description: 'Anexar artifacts ao Release existente (informe a tag, ex: v0.5.0)'
        required: false
        default: ''

jobs:
  build:
    name: TWA APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: write  # pra anexar assets ao Release

    env:
      # Necessário pra Bubblewrap
      JAVA_VERSION: '17'
      NODE_VERSION: '22'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap + expect
        # `expect` automatiza prompts interativos do bubblewrap — necessário
        # porque os comandos build/update são interativos por design e
        # `bubblewrap build` faz vários prompts antes dos de senha (que
        # quebraria com pipe simples).
        run: |
          sudo apt-get update -y
          sudo apt-get install -y expect
          npm install -g @bubblewrap/cli

      - name: Pre-configure Bubblewrap (skip JDK install prompt)
        # Bubblewrap pergunta interativamente "Install JDK? (Y/n)" na primeira
        # execução. Como o setup-java action já instalou Java 17 e setup-android
        # já populou o SDK, criamos `~/.bubblewrap/config.json` pré-emptivamente
        # apontando pros paths do CI — Bubblewrap detecta e pula o wizard.
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF
          cat "$HOME/.bubblewrap/config.json"

      - name: Validate secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD e ANDROID_KEY_PASSWORD são obrigatórios."
            echo "::error::Veja Docs/twa.md pra setup. Sem keystore, não há como assinar o APK."
            exit 1
          fi
          echo "✓ Secrets presentes"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/twa/drift-release.keystore
          ls -lh app/twa/drift-release.keystore

      - name: Resolve version + sync twa-manifest
        id: version
        run: |
          # Tag: v0.5.0 → 0.5.0 ; manual: pega de package.json
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # appVersionCode = 1 + número de commits (monotônico, único por build)
          VERSION_CODE=$(($(git rev-list --count HEAD)))
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          # Sincroniza versão no twa-manifest.json
          node -e "
            const fs=require('fs');
            const m=JSON.parse(fs.readFileSync('app/twa/twa-manifest.json','utf8'));
            m.appVersionName='$VERSION';
            m.appVersion=$VERSION_CODE;
            m.appVersionCode=$VERSION_CODE;
            fs.writeFileSync('app/twa/twa-manifest.json',JSON.stringify(m,null,2)+'\n');
          "
          echo "✓ TWA manifest sincronizado: version=$VERSION code=$VERSION_CODE"

      - name: Bubblewrap update
        working-directory: app/twa
        run: |
          # Bubblewrap commands são interativos por design. Pipeamos `yes ""`
          # pra aceitar o default em cada prompt (versão, packageId, etc) —
          # os valores reais vêm do twa-manifest.json que já editamos acima.
          # `yes ""` fornece linhas vazias infinitas; bubblewrap interpreta
          # cada Enter como "use default".
          if [ ! -f "build.gradle" ]; then
            yes "" | bubblewrap init --manifest=https://drift-wheat-one.vercel.app/manifest.webmanifest --directory=. --skipPwaValidation || true
          fi
          yes "" | bubblewrap update

      - name: Bubblewrap build (via expect)
        working-directory: app/twa
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # bubblewrap build pergunta tanto coisas de confirmação ("regenerate
          # signing key?", "Yes/No") quanto passwords. expect casa pelo texto
          # do prompt e responde corretamente — pipe simples não dá conta
          # porque a ordem dos prompts varia entre primeira e N-ésima execução.
          #
          # exp_continue depois de cada match faz o expect continuar
          # observando outros prompts no mesmo spawn.
          expect <<'EOF'
          set timeout 1200
          set keystore_pwd $env(KEYSTORE_PASSWORD)
          set key_pwd      $env(KEY_PASSWORD)

          spawn bubblewrap build --skipPwaValidation

          expect {
            -re "(?i)password for the key store" {
              send -- "$keystore_pwd\r"
              exp_continue
            }
            -re "(?i)password for the key:" {
              send -- "$key_pwd\r"
              exp_continue
            }
            -re "\\(Y/n\\)|\\(y/N\\)" {
              # Aceita default de qualquer prompt yes/no (ex: regenerar key)
              send -- "\r"
              exp_continue
            }
            timeout {
              puts "::error::expect timeout"
              exit 2
            }
            eof {
              # Bubblewrap saiu — pega o exit code
              catch wait result
              set exit_status [lindex $result 3]
              exit $exit_status
            }
          }
          EOF
          ls -lh ./*.apk ./*.aab 2>/dev/null || true

      - name: Rename artifacts
        working-directory: app/twa
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          [ -f app-release-signed.apk ] && mv app-release-signed.apk "drift-v${VERSION}.apk" || true
          [ -f app-release-bundle.aab ] && mv app-release-bundle.aab "drift-v${VERSION}.aab" || true
          ls -lh ./drift-*.apk ./drift-*.aab 2>/dev/null || true

      - name: Upload artifacts (sempre disponíveis em runs)
        uses: actions/upload-artifact@v4
        with:
          name: twa-apk-aab
          path: |
            app/twa/drift-*.apk
            app/twa/drift-*.aab
          retention-days: 30

      - name: Resolve target tag for release attachment
        id: target
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.attach_to_release }}" ]; then
            echo "tag=${{ github.event.inputs.attach_to_release }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach to GitHub Release
        if: steps.target.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: app/twa
        run: |
          gh release upload "${{ steps.target.outputs.tag }}" \
            "drift-v${{ steps.version.outputs.version }}.apk" \
            "drift-v${{ steps.version.outputs.version }}.aab" \
            --clobber

      - name: Print SHA256 fingerprint reminder
        if: success()
        run: |
          echo "::notice::Pra TWA abrir sem barra do Chrome, SHA256 do certificado precisa estar em /.well-known/assetlinks.json"
          echo "::notice::Capture com: keytool -list -v -keystore app/twa/drift-release.keystore -alias drift"
