name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel previous runs of the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # Node 22 é o piso — @sqlite.org/sqlite-wasm 3.51.2-build9 exige >=22.
        # Adicionar 24 quando virar LTS (out/2026).
        node: [22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        # `npm ci` falha com EBADPLATFORM em binários cross-platform do esbuild
        # quando o lockfile foi gerado em outro OS (bug conhecido do npm com
        # entries "extraneous": true). `npm install` é mais permissivo —
        # versões ainda travadas pelo lockfile, só a resolução de optional
        # deps é mais flexível.
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Typecheck (tsc strict)
        run: npx tsc --noEmit

      - name: Tests (vitest)
        run: npm run test

      - name: Build (vite + tsc)
        run: npm run build

      - name: Upload dist (artifact pra inspeção)
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  rust-check:
    # Sprint 1 do roadmap pós-auditoria: garantir que ninguém commita Rust
    # quebrado em src-tauri/. O bug do Dockerfile.reproducible (run
    # 25226715868) escapou exatamente porque CI não tocava cargo. 15 min
    # de YAML evita classe inteira de regressões.
    #
    # Modo default (sem --features arti): rápido (~6s incremental, ~2min
    # cold). Cobre lib.rs, tor.rs stub, mudanças de Tauri config.
    #
    # Modo --features arti: lento (4min cold compile do workspace arti),
    # roda em job separado opt-in via push pra branch principal apenas
    # (não em PR, não em fork) pra economizar minutos. Smoke do binário
    # final fica como sprint manual; aqui só validamos que compila.
    name: cargo check (default + --features arti)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        # Trocado de pin específico pra `stable` após cascata de bumps:
        #   1.83 → edition2024 (serde_spanned)
        #   1.85 → darling 0.23, icu 2.2
        #   1.88 → retry-error 0.12, tor-error 0.41
        #   1.89 → typed-index-collections 3.5
        # arti workspace + deps transitivas continuam puxando MSRVs cada
        # vez mais altos. Pinar versão exata aqui vira jogo de gato e
        # rato. Determinismo vive em `Dockerfile.reproducible` (que é o
        # canônico pra auditar binário publicado); CI roda contra stable
        # pra detectar drift de API real, não brigar com MSRV de deps.
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install Tauri Linux deps
        # Tauri pull GTK + WebKitGTK + soup. Necessário mesmo só pra cargo check
        # porque os crates referenciam APIs C que precisam dos headers.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev libsoup-3.0-dev pkg-config

      - name: cargo check (default — stub IPC, sem arti)
        working-directory: src-tauri
        run: cargo check --locked

      - name: cargo check (--features arti)
        # Roda apenas em push pra main (não em PR de fork) pra economizar
        # minutos. Cold cache primeira vez ~4min; subsequente ~5s.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: src-tauri
        run: cargo check --locked --features arti
