name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel previous runs of the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # Node 20 LTS é o piso suportado. 22 mantém heads-up pra versão atual.
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install (deterministic)
        run: npm ci

      - name: Typecheck (tsc strict)
        run: npx tsc --noEmit

      - name: Tests (vitest)
        run: npm run test

      - name: Build (vite + tsc)
        run: npm run build

      - name: Upload dist (Node 20 only — artifact pra inspeção)
        if: matrix.node == 20
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
