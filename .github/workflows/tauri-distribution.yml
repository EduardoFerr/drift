name: tauri-distribution

# Track A.1 do roadmap-v060.md — binário Tauri cross-platform com Tor real
# (`--features arti`), anexado a GitHub Release. Coexiste com:
#   - release.yml         → PWA dist.zip
#   - reproducible-build.yml → Tauri Linux determinístico (audit-grade)
#   - twa.yml             → APK/AAB Android
#
# Este workflow é DISTRIBUIÇÃO (binários pra end users), NÃO reprodutibilidade
# auditável (Linux Tauri reproduzível continua via Dockerfile.reproducible).
#
# Code signing: NÃO incluído nesta versão (alpha). Quando user fornecer
# Apple Developer cert + Windows EV cert (~$300/ano combinado), Track A.2
# adiciona env vars APPLE_* / WINDOWS_* + steps de assinatura. Sem cert,
# users veem Gatekeeper (mac) / SmartScreen (Win) — README documenta
# workaround "right-click → Open" e "More info → Run anyway".

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag pra rebuild (ex: v0.6.0-alpha.3)'
        required: true

concurrency:
  group: tauri-dist-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # upload em release existente

jobs:
  build:
    name: Tauri ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false   # Linux falhar não cancela mac/win e vice-versa
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: macos
            os: macos-latest   # arm64 (Apple Silicon). Intel via macos-13 fica pra A.2
            target: aarch64-apple-darwin
          - platform: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        # `stable` em vez de pin (1.83/1.90/etc.) — MSRV das deps arti
        # workspace escala rápido (CHANGELOG nota cascata 1.83→1.90 em
        # 2026-05-01). CI usa stable pra detectar drift; reprodutibilidade
        # auditável via Dockerfile.reproducible (que pina explicitamente).
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Key inclui plataforma — caches são por-OS no GitHub Actions, mas
          # Swatinem já lida com isso. shared-key permite reuso entre PRs.
          shared-key: tauri-dist-${{ matrix.platform }}

      - name: Install Linux WebKit + Tauri deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            file
          # Versions equivalentes a Dockerfile.reproducible (que usa o mesmo
          # set, exceto build-essential que ubuntu-22.04 já tem).

      - name: Install npm deps
        run: npm install --no-audit --no-fund --prefer-offline
        # `npm install` em vez de `npm ci` — mesmo motivo do ci.yml e
        # Dockerfile.reproducible (esbuild cross-platform mismatch entre
        # vitest 4.x bundled 0.28 e vite 5.x 0.21).

      - name: Build PWA dist (frontend)
        run: npm run build

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "✓ Tag: $TAG"

      - name: Sanity check — tauri.conf.json version vs tag
        shell: bash
        run: |
          CONF_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$CONF_VERSION" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::Tag ${{ steps.tag.outputs.tag }} != tauri.conf.json version=$CONF_VERSION"
            echo "::error::Bump src-tauri/tauri.conf.json antes de criar a tag"
            exit 1
          fi
          echo "✓ tauri.conf.json $CONF_VERSION ↔ tag ${{ steps.tag.outputs.tag }}"

      - name: Tauri build (with arti = Tor real)
        # `--features arti` arrasta arti workspace inteiro (~30 crates,
        # ~5min na primeira build, depois cached). Cumpre §15 anti-censura
        # por país. Sem essa flag o build seria PWA-wrapper sem Tor real.
        # `npx tauri` resolve o @tauri-apps/cli local de devDependencies.
        run: npx tauri build --features arti
        env:
          CI: true
          # TODO Track A.2 (code signing):
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: List built bundles
        shell: bash
        run: |
          # Tauri 2 layout:
          #   Linux:   bundle/{deb,appimage}/
          #   macOS:   bundle/{dmg,macos}/
          #   Windows: bundle/{msi,nsis}/
          find src-tauri/target/release/bundle -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \
               -o -name '*.app.tar.gz' -o -name '*.msi' -o -name '*.exe' \) \
            -ls 2>/dev/null || echo "Nenhum bundle encontrado em src-tauri/target/release/bundle"

      - name: Generate per-platform SHA256SUMS
        shell: bash
        run: |
          cd src-tauri/target/release/bundle
          # LC_ALL=C garante sort byte-a-byte (sem locale-dep), -print0/sort -z/xargs -0
          # tolera filenames com espaço.
          LC_ALL=C find . -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \
               -o -name '*.app.tar.gz' -o -name '*.msi' -o -name '*.exe' \) \
            -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum > "SHA256SUMS-${{ matrix.platform }}.txt" 2>/dev/null || true
          if [ -s "SHA256SUMS-${{ matrix.platform }}.txt" ]; then
            cat "SHA256SUMS-${{ matrix.platform }}.txt"
          else
            echo "::warning::SHA256SUMS-${{ matrix.platform }}.txt vazio — nenhum bundle gerado"
          fi

      - name: Upload to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          # `fail_on_unmatched_files: false` — se uma plataforma não gerou
          # AppImage (ex: Linux gera .deb mas AppImage falhou por libfuse),
          # outras plataformas continuam. Manualmente reconciliável via
          # workflow_dispatch.
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/SHA256SUMS-${{ matrix.platform }}.txt
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload as workflow artifact (manual disp / debug)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: drift-tauri-${{ matrix.platform }}-${{ steps.tag.outputs.tag }}
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/SHA256SUMS-*.txt
          retention-days: 30

      - name: Distribution warning (unsigned)
        if: success()
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            macos)
              echo "::notice::macOS bundle não está notarizado. Users veem Gatekeeper."
              echo "::notice::Workaround: System Settings → Privacy → Open Anyway, OU right-click .app → Open."
              ;;
            windows)
              echo "::notice::Windows bundle não está assinado. Users veem SmartScreen."
              echo "::notice::Workaround: clique em 'More info' → 'Run anyway'."
              ;;
            linux)
              echo "::notice::Linux .deb/.AppImage não estão GPG-assinados (most users não verificam)."
              echo "::notice::Audit: hash via SHA256SUMS-linux.txt + Dockerfile.reproducible."
              ;;
          esac
